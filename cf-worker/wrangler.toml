name = "aged-hall-eff1"
main = "worker.js"
compatibility_date = "2025-01-01"

# Refreshes the KV cache every 3 hours - matches CACHE_TTL_SECONDS in worker.js.
[triggers]
crons = ["0 */3 * * *"]

[[kv_namespaces]]
binding = "SHOWMUST_KV"
id = "d60268811209470f8e9db1452cf3ae8b"

# No secrets required to run - IMDb ratings are resolved client-side per user (see
# index.html), not by this worker.
#
# Optional: JINA_API_KEY. Barby is the one source proxied through Jina (SPA + WAF-blocked
# API), and Jina's free anonymous tier shares its rate limit across all Workers' outbound
# IPs - so Barby can get stuck on 429s that have nothing to do with this app's own traffic.
# A free key from https://jina.ai moves it onto its own account quota. Works without one,
# just as unreliably as before.
# wrangler secret put JINA_API_KEY
#
# Optional: SCRAPE_SECRET. Gates the manual scrape trigger (GET /scrape?key=... or
# GET /?scrape=true&key=...) that forces an immediate re-scrape instead of waiting for the
# next cron run - useful right after fixing a broken source. Without this secret set, the
# endpoint always returns 401 (unset is never treated as "no key required").
# wrangler secret put SCRAPE_SECRET
